id: google-docs
name: Google Docs (OAuth2)
brandName: Google Docs
type: oauth2
icon: /logos/google-docs.svg
description: Connect to Google Docs via Google OAuth2 to read, write, and manage documents.
documentationUrl: https://developers.google.com/docs/api/reference/rest

properties:
  - name: clientId
    displayName: Client ID
    type: string
    required: true
    description: OAuth2 Client ID from Google Cloud Console
  - name: clientSecret
    displayName: Client Secret
    type: secret
    required: true
    description: OAuth2 Client Secret from Google Cloud Console
  - name: scope
    displayName: Scopes
    type: string
    required: true
    description: >
      Space-separated list of Google Docs API scopes. The default grants full read/write
      access to documents; use https://www.googleapis.com/auth/documents.readonly for
      read-only, or adjust to change the permissions requested.
    default: 'openid email https://www.googleapis.com/auth/documents'

oauth2:
  authorizationUrl: 'https://accounts.google.com/o/oauth2/v2/auth'
  accessTokenUrl: 'https://oauth2.googleapis.com/token'
  clientIdProperty: clientId
  clientSecretProperty: clientSecret
  authStyle: inBody
  # Google requires these to issue a refresh_token on first authorization
  extraAuthParams:
    access_type: offline
    prompt: consent

requestMapping:
  headers:
    Authorization: 'Bearer {{properties.accessToken}}'

testRequest:
  method: GET
  url: 'https://www.googleapis.com/oauth2/v3/userinfo'
  accountIdentifierKey: email
