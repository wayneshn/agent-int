# Test gate: unit + API integration + e2e smoke on every PR/push; nightly adds
# coverage. Callable via workflow_call so docker-publish.yml can require green
# tests before publishing images. Actions are pinned to commit SHAs.

name: test

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # nightly
  workflow_call:

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/valmis_test

jobs:
  test:
    name: unit + integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valmis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valmis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.20.0

      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # agent-runtime dist (process driver) + package dists are needed by tests
      - name: build
        run: pnpm build

      - name: unit tests
        run: pnpm -r test

      - name: integration tests
        run: pnpm test:integration

      - name: coverage (nightly only)
        if: github.event_name == 'schedule'
        run: |
          pnpm --filter @repo/backend exec vitest run --project unit --coverage
          pnpm --filter @repo/utils exec vitest run --coverage
          pnpm --filter @repo/extractor exec vitest run --coverage

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: valmis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d valmis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.20.0

      - name: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # e2e runs the production build (adapter-node) + process-driver runtimes
      - name: build
        run: pnpm build

      - name: playwright chromium
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: e2e tests
        run: pnpm test:e2e

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
